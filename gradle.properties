# Arguments JVM du démon Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Bibliothèques AndroidX obligatoires (remplacent l'ancienne support library).
android.useAndroidX=true

# Génère une classe R par module : builds plus rapides, moins de collisions.
android.nonTransitiveRClass=true

# Style de code Kotlin officiel.
kotlin.code.style=official
