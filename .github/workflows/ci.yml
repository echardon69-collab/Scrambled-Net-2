name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Les images ubuntu-24.04 embarque déjà le SDK Android (cmdline-tools,
      # platforms et build-tools récents). setup-android ne sert ici qu'à
      # accepter les licences : ses paquets par défaut (l'obsolète 'tools')
      # n'existent plus dans le dépôt SDK et font échouer l'action.
      - name: Accepter les licences du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
