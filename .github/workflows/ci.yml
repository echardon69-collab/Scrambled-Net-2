name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Les images ubuntu-24.04 embarque déjà le SDK Android (cmdline-tools,
      # platforms et build-tools récents). setup-android ne sert ici qu'à
      # accepter les licences : ses paquets par défaut (l'obsolète 'tools')
      # n'existent plus dans le dépôt SDK et font échouer l'action.
      - name: Accepter les licences du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # Saveurs de distribution (14 nov. 2026) : avec des saveurs, les
      # tâches Gradle changent de nom (testGithubDebugUnitTest,
      # assemblePlayDebug, lintGithubDebug...) — les DEUX APK sont
      # testés, bâtis et lintés à chaque poussée : l'APK Play doit
      # rester propre (manifeste sans REQUEST_INSTALL_PACKAGES), le
      # GitHub ne régresse pas.
      - name: Unit tests (JVM)
        run: ./gradlew testGithubDebugUnitTest testPlayDebugUnitTest --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleGithubDebug assemblePlayDebug --stacktrace

      - name: Lint
        run: ./gradlew lintGithubDebug lintPlayDebug --stacktrace
