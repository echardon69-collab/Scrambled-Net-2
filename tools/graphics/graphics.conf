; ---------------------------------------------------------------------------
; Configuration de la génération des éléments graphiques du jeu.
; ---------------------------------------------------------------------------
; SYNTAXE (fichier INI) : chaque ligne non vide doit être une section
; [nom], une option "cle = valeur", ou un commentaire commençant par
; « ; » ou « # » EN DÉBUT DE LIGNE — sinon l'outil s'arrête avec un
; message d'erreur.
;
; Le SVG source UNIQUE contient tous les éléments de base, chacun dans
; son calque (calques Inkscape). Chaque section ci-dessous (hors [svg])
; = un ÉLÉMENT DU JEU : le drawable Android res/drawable/<section>.xml.
;
; Options de chaque section :
;   layers   = calques du SVG à activer, séparés par des virgules.
;              L'ordre de DESSIN est celui du document SVG (comme des
;              calques qu'on affiche ou masque dans Inkscape), pas
;              l'ordre de cette liste ;
;   grey     = true génère AUSSI la variante grise <section>_grey.xml
;              (règle greyOut de l'original : chaque canal RGB devient
;              0,6 x valeur + 100 — ne jamais dessiner de calque gris,
;              la variante est calculée par l'outil) ;
;   dp       = taille du drawable en dp (défaut 64) ;
;   viewport = "LxH" optionnel, défaut = le viewBox du SVG.
;
; Un élément du SVG est identifié par son inkscape:label (le nom
; visible dans Inkscape), son data-name (le nom lisible défini par
; l'outil de dessin : VectorCraft, Illustrator et similaires) OU
; son id XML : adapter les noms ci-dessous à VOTRE
; SVG.
;
; REGROUPEMENTS ET ÉLÉMENTS NOMMÉS : tout élément NOMMÉ d'un calque —
; sous-calque Inkscape (Calques > Ajouter un calque, dans un calque),
; groupe, ou simple forme (un rect, un path...) — est addressable
; par son CHEMIN, niveaux séparés par des « / » :
;   layers = coudes/Coude droit        (sous-calque « Coude droit »)
;   layers = Câbles/Vertical           (le rect id="Vertical")
; Choisir le calque PÈRE prend tout son contenu, sous-calques et
; éléments compris ; on peut mixer calques entiers et sous-éléments
; précis :
;   layers = Ecran, Connecteurs/Haut
; (tout « Ecran », plus le seul élément « Haut » de « Connecteurs »).
; Un élément SANS aucun nom (id, label, data-name) n'est PAS
; addressable — ses tracés appartiennent au calque qui l'entoure.
;
; Le VectorDrawable ne peut pas tout reprendre du SVG : les <image>
; (bitmaps) sont ignorées avec une note ; les contours stroke sont
; convertis (android:strokeColor/Width/LineJoin/LineCap) ;
; opacity/fill-opacity sont appliqués à l'alpha des couleurs ;
; mix-blend-mode et gradientTransform ne sont pas représentables et
; sont ignorés avec une note (rendu approché).
;
; Le jeu charge exactement les 17 drawables ci-dessous (BoardView,
; R.drawable.*) ; tout écart est signalé par l'outil.
;
; Exécution, à la racine du dépôt :
;   tools/graphics/generate-graphics.sh                   (Linux/Mac)
;   tools/graphics/generate-graphics.bat                  (Windows)
;   python3 tools/graphics/generate_graphics.py           (génère)
;   python3 tools/graphics/generate_graphics.py --check   (valide seul)
; ---------------------------------------------------------------------------

[svg]
; Le SVG unique à calques (à créer / adapter : c'est VOTRE fichier).
file = svg/netscramble2-sources.svg
; Répertoire de sortie (défaut = app/src/main/res/drawable) :
; output = app/src/main/res/drawable

; --- Câbles : 5 formes de base. Les 15 orientations du jeu sont des
;     rotations au dessin (BoardView), la variante grise est calculée. ---

[cable_straight]
layers = Câbles/Vertical
grey = true

[cable_elbow]
layers = Coudes/Haut_et_droite, Câbles/Haut, Câbles/Droite
grey = true

[cable_ttee]
layers = Câbles/Vertical, Câbles/Droite, Manchons/Haut, Manchons/Droite, Manchons/Bas, Centre_T_ou_croix/Droite, Dégradés/Bas_et_droite, Dégradés/Haut_et_droite
grey = true

[cable_cross]
layers = Câbles/Vertical, Câbles/Horizontal, Manchons, Centre_T_ou_croix, Dégradés
grey = true

[cable_stub]
layers = Câbles/Haut
grey = true

; --- Terminaux : computer1 = écran ROUGE (éteint / déconnecté),
;     computer2 = écran VERT (allumé / relié au serveur). ---

[computer1]
layers = Terminal/Terminal, Terminal/Off

[computer2]
layers = Terminal/Terminal, Terminal/On

; --- Serveur : server = DEL ROUGES (partiellement câblé),
;     server1 = DEL VERTES (entièrement câblé). ---

[server]
layers = Generateur/Generateur, Generateur/Off

[server1]
layers = Generateur/Generateur, Generateur/On

; --- Fonds de tuile : normal / verrouillé (appui long) / vide
;     (cellule libre du générateur original et décor hors plateau). ---

[tile_background]
layers = Fonds
viewport = 64x64

[tile_background_locked]
layers = Fonds
viewport = 64x64

[tile_background_empty]
layers = Fonds
viewport = 64x64
